name: cliniq
description: "Cliniq - AI Health Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # Google Sign In
  google_sign_in: ^6.2.1

  # AI / Functions
  cloud_functions: ^5.1.3

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3

  # Camera + OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0

  # Location + Maps
  geolocator: ^13.0.1
  url_launcher: ^6.3.0

  # Utils
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  gal: ^1.1.1
  share_plus: ^10.0.2
  flutter_svg: ^2.0.10+1

  cupertino_icons: ^1.0.8
  go_router: ^17.2.0
  provider: ^6.1.5+1
  iconsax_flutter: ^1.0.1
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_local_notifications: ^21.0.0
  hugeicons: ^1.1.6
  purchases_flutter: ^10.0.1
  google_mobile_ads: ^8.0.0
  package_info_plus: ^9.0.1
  firebase_remote_config: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1  # ✅ Add kiya

# ✅ Launcher Icons Config
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/cliniq_logo (1).png"
  adaptive_icon_background: "#534AB7"
  adaptive_icon_foreground: "assets/images/cliniq_logo (1).png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/